[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "configstore"
version = "0.1.0"
description = "Configuration storage on etcd: layered resolution, atomic applies, watch-fed client caches, and history that outlives compaction."
readme = "README.md"
# 3.11 rather than the 3.12 the sibling projects ask for, and deliberately: the
# client half of this package is imported *into* application virtualenvs, and
# the oldest one that has to keep working (the chatbot's Docker image) is 3.11.
# A library that cannot be installed beside its consumers is not a library.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Micheal Manullang", email = "michaelchristopher-ui@users.noreply.github.com" }]
keywords = ["configuration", "etcd", "feature-flags", "watch", "mvcc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]

# `requests` and nothing else. The read path is what gets installed into every
# consumer, so every dependency here is a dependency that can conflict with
# something an application already pins. This is not frugality for its own sake:
# `etcd3`, the obvious choice, ships protobuf-3.x-era generated stubs and cannot
# be imported at all beside the protobuf 5.x that pymilvus requires — see
# ARCHITECTURE.md, "Why this speaks HTTP". Talking to the gRPC-gateway over JSON
# means no protobuf, no grpcio, and no version negotiation with the host app.
dependencies = [
  "requests>=2.28",
]

[project.optional-dependencies]
# The Streamlit console is optional: nothing about the store needs it running.
ui = [
  "streamlit>=1.36",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests>=2.28",
]

[project.scripts]
configstore = "configstore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/configstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "etcd: needs a live etcd (set CONFIGSTORE_ETCD_URL, or `make etcd-up`)",
]

[tool.ruff]
line-length = 88
src = ["src", "tests", "ui"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "ui"]
strict = true

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Checked at `python_version = 3.11` (the oldest consumer that must work), but
# resolved against whatever interpreter uv provisioned — which is newer, and
# whose numpy stubs use 3.12+ `type` statements. Skipping the bodies of these
# stubs keeps the version we *target* independent of the one we develop on;
# nothing here calls into them, they arrive via streamlit's dataframe support.
module = ["numpy.*", "pandas.*", "pyarrow.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
